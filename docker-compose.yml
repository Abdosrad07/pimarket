version: '3.9'

services:
    db:
        image: postgres:15-alpine
        volumes:
          - postgres_data:/var/lib/postgresql/data
        environment:
          - POSTGRES_DB=pimarket
          - POSTGRES_USER=pimarket
          - POSTGRES_PASSWORD=pimarket123
        ports:
          - "5432:5432"
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U pimarket"]
          interval: 5s
          timeout: 5s
          retries: 5
    redis:
       image: redis:7-alpine
       ports:
         - "6379:6379"
       healthcheck:
         test: ["CMD", "redis-cli", "ping"]
         interval: 5s
         timeout: 3s
         retries: 5
    django:
       build:
         context: .
         dockerfile: docker/django/Dockerfile
       command: >-
         sh -c "python manage.py migrate --noinput &&
                python manage.py seed_demo_data &&
                python manage.py collectstatic --noinput &&
                gunicorn pimarket.wsgi --bind 0.0.0.0:8000 --log-file - --access-logfile -"
       volumes:
         - .:/app
         - static_volume:/app/staticfiles
         - media_volume:/app/media
       ports:
         - "8000:8000"
       environment:
         # Fonctionne sans fichier .env ; surcharger selon vos besoins
         - DEBUG=True
         - DATABASE_URL=postgres://pimarket:pimarket123@db:5432/pimarket
         - REDIS_URL=redis://redis:6379/0
         - CELERY_BROKER_URL=redis://redis:6379/0
         - CELERY_RESULT_BACKEND=redis://redis:6379/0
         - SMS_PROVIDER=mock
         - DEMO_PAYMENTS=True
         - ALLOWED_HOSTS=*
       depends_on:
         db:
           condition: service_healthy
         redis:
           condition: service_healthy
    celery_worker:
      build:
        context: .
        dockerfile: docker/django/Dockerfile
      command: celery -A pimarket worker --loglevel=info
      volumes:
        - .:/app
      environment:
        - DEBUG=True
        - DATABASE_URL=postgres://pimarket:pimarket123@db:5432/pimarket
        - REDIS_URL=redis://redis:6379/0
        - CELERY_BROKER_URL=redis://redis:6379/0
        - CELERY_RESULT_BACKEND=redis://redis:6379/0
        - SMS_PROVIDER=mock
        - DEMO_PAYMENTS=True
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
    celery_beat:
      build:
        context: .
        dockerfile: docker/django/Dockerfile
      command: celery -A pimarket beat --loglevel=info
      volumes:
        - .:/app
      environment:
        - DEBUG=True
        - DATABASE_URL=postgres://pimarket:pimarket123@db:5432/pimarket
        - REDIS_URL=redis://redis:6379/0
        - CELERY_BROKER_URL=redis://redis:6379/0
        - CELERY_RESULT_BACKEND=redis://redis:6379/0
        - SMS_PROVIDER=mock
        - DEMO_PAYMENTS=True
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
volumes:
  postgres_data:
  static_volume:
  media_volume:
