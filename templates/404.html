{% extends 'base.html' %}
{% load static %}

{% block title %}Page non trouvée - Pi Market{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size:8rem;line-height:1;opacity:0.15;color:var(--pi-purple);">
        <i class="bi bi-emoji-frown"></i>
    </div>
    <h1 class="fw-bold mt-3" style="font-size:4rem;color:var(--pi-purple);">404</h1>
    <h2 class="fw-bold mb-3">Page non trouvée</h2>
    <p class="text-muted mb-4" style="max-width:400px;margin:0 auto;">
        Oups ! La page que vous recherchez n'existe pas ou a été déplacée.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'home' %}" class="btn btn-pi btn-lg">
            <i class="bi bi-house me-1"></i> Retour à l'accueil
        </a>
        <a href="{% url 'product_list' %}" class="btn btn-pi-outline btn-lg">
            <i class="bi bi-grid-3x3-gap me-1"></i> Explorer les produits
        </a>
    </div>
</div>
{% endblock %}
