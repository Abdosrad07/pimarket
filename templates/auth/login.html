{% extends 'base.html' %}

{% block title %}Connexion - Pi Market{% endblock %}

{% block extra_css %}
<style>
    .auth-card { max-width: 440px; margin: 0 auto; }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h2 { font-weight: 800; letter-spacing: -0.02em; }
    .auth-divider { display:flex;align-items:center;gap:12px;margin:1.2rem 0;color:#9ca3af;font-size:0.85rem; }
    .auth-divider::before,.auth-divider::after { content:'';flex:1;height:1px;background:var(--pi-border); }
    .pi-btn-auth { background:linear-gradient(135deg,#f0b800,#ffd700);color:#1a1a2e;border:none;font-weight:700;padding:12px;border-radius:12px;font-size:1rem;transition:all var(--transition); }
    .pi-btn-auth:hover { transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,215,0,0.35);color:#1a1a2e; }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <div style="font-size:2.8rem;color:var(--pi-gold);margin-bottom:8px;"><i class="bi bi-currency-bitcoin"></i></div>
        <h2>Connexion</h2>
        <p class="text-muted">Accédez à votre espace Pi Market</p>
    </div>

    <div class="card-pi">
        <div class="card-body p-4">
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <!-- Pi Login -->
            <button class="pi-btn-auth w-100 mb-3 d-flex align-items-center justify-content-center gap-2" id="pi-login-btn">
                <i class="bi bi-currency-bitcoin fs-5"></i> Se connecter avec Pi
            </button>

            <div class="auth-divider">OU</div>

            <!-- Phone Login -->
            <form id="phoneLoginForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="phone_number" class="form-label fw-semibold">
                        <i class="bi bi-phone me-1"></i> Numéro de téléphone
                    </label>
                    <input type="tel" class="form-control form-control-lg" id="phone_number"
                           placeholder="+221 77 000 00 00" required autocomplete="tel">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-pi btn-lg" id="phoneLoginBtn">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Continuer
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">
                    Pas encore de compte ?
                    <a href="{% url 'register' %}" class="fw-bold text-decoration-none" style="color:var(--pi-purple);">Inscrivez-vous</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function getCookie(name) {
    let v = null;
    document.cookie.split(';').forEach(c => {
        c = c.trim();
        if (c.startsWith(name + '=')) v = decodeURIComponent(c.substring(name.length + 1));
    });
    return v;
}

// Pi Login
document.getElementById('pi-login-btn').addEventListener('click', async function() {
    const btn = this;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Authentification...';
    btn.disabled = true;
    const errEl = document.getElementById('error-message');
    errEl.classList.add('d-none');

    try {
        const authResult = await Pi.authenticate(['username', 'payments'], function(){});
        const resp = await fetch('/api/accounts/pi-auth/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify(authResult)
        });
        const data = await resp.json();
        if (resp.ok) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            localStorage.setItem('user', JSON.stringify(data.user));
            showToast('success', 'Connexion réussie !');
            window.location.href = "{% url 'account_dashboard' %}";
        } else {
            showToast('error', data.error || 'Erreur lors de la connexion.');
        }
    } catch (e) {
        showToast('error', e.message || "L'authentification a échoué.");
    } finally {
        btn.innerHTML = '<i class="bi bi-currency-bitcoin fs-5"></i> Se connecter avec Pi';
        btn.disabled = false;
    }
});

// Phone Login
document.getElementById('phoneLoginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('phoneLoginBtn');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Connexion...';
    btn.disabled = true;
    const errEl = document.getElementById('error-message');
    errEl.classList.add('d-none');

    try {
        const resp = await fetch('/api/accounts/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ phone_number: document.getElementById('phone_number').value })
        });
        const result = await resp.json();
        if (resp.ok) {
            localStorage.setItem('access_token', result.access);
            localStorage.setItem('refresh_token', result.refresh);
            localStorage.setItem('user', JSON.stringify(result.user));
            showToast('success', 'Connexion réussie !');
            window.location.href = "{% url 'account_dashboard' %}";
        } else {
            showToast('error', result.error || 'Identifiants incorrects.');
        }
    } catch (e) {
        showToast('error', 'Erreur de connexion : ' + e.message);
    } finally {
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Continuer';
        btn.disabled = false;
    }
});
</script>
{% endblock %}
